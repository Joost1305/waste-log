<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F5D50">
  <title>WASTE log</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden></div>
  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/">
      <img src="img/icon.svg" alt="" width="28" height="28">
      <span class="brand-text">WASTE log</span>
    </a>
    <nav id="nav" class="nav"></nav>
    <div class="topbar-right">
      <select id="org-switch" class="org-switch" hidden aria-label="Organization"></select>
      <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Menu">&#9776;</button>
    </div>
  </header>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true"></div>
  </div>
  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
